services:
  - type: web
    name: ai-web-threat-intelligence-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: uv sync --locked --no-dev --active
    startCommand: uv run --active --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: UV_VERSION
        value: 0.13.7
      - key: FRONTEND_ORIGIN
        sync: false
      - key: URLHAUS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false

  - type: web
    name: ai-web-threat-intelligence-frontend
    runtime: static
    rootDir: frontend
    buildCommand: bun install --frozen-lockfile && bun run build
    staticPublishPath: dist
    envVars:
      - key: BUN_VERSION
        value: 1.3.14
      - key: VITE_API_BASE_URL
        fromService:
          name: ai-web-threat-intelligence-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
