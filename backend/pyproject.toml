[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "dnspython>=2.9.2",
    "fastapi[standard]>=0.162.0",
    "fraudurl>=1.0.1",
    "httpx>=0.28.1",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "tldextract>=5.3",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
